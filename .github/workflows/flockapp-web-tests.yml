name: FlockApp Web Tests

on:
  push:
    branches: [main]
    paths: ['FlockApp/**', '.github/workflows/flockapp-web-tests.yml']
  pull_request:
    branches: [main]
    paths: ['FlockApp/**', '.github/workflows/flockapp-web-tests.yml']
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FlockApp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B clean verify

      - name: Upload Serenity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: FlockApp/target/site/serenity
